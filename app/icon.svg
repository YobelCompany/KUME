<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70">
  <!-- 파비콘용 정사각 프레임 (전체 원판 없이 여백만 조정) -->
  <g transform="translate(0, 15)">
    <!-- 광선 5개 -->
    <g stroke="#bd5732" stroke-width="2.6" stroke-linecap="round">
      <line x1="35" y1="3" x2="35" y2="11"/>
      <line x1="25" y1="6" x2="28" y2="13"/>
      <line x1="45" y1="6" x2="42" y2="13"/>
      <line x1="16" y1="12" x2="21" y2="17"/>
      <line x1="54" y1="12" x2="49" y2="17"/>
    </g>
    <!-- 해 (반원) -->
    <path d="M21 30 A14 14 0 0 1 49 30 Z" fill="#bd5732"/>
    <!-- 지평선 -->
    <line x1="4" y1="30" x2="66" y2="30" stroke="#bd5732" stroke-width="2.2" stroke-linecap="round"/>
  </g>
